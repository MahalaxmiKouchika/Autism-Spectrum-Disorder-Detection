<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASD Predictor (Fast Demo)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f6; display: flex; justify-content: center; padding: 2rem; color: #31333F; }
        .container { background-color: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center; }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        p { color: #555; margin-bottom: 2rem; line-height: 1.5; }
        .upload-area { border: 2px dashed #ccc; border-radius: 10px; padding: 2rem; cursor: pointer; margin-bottom: 1rem; transition: background 0.3s; }
        .upload-area:hover { background-color: #f9f9f9; }
        #preview { max-width: 100%; max-height: 300px; border-radius: 5px; margin-top: 1rem; display: none; }
        .hidden { display: none; }
        .results { margin-top: 2rem; padding: 1.5rem; border-radius: 8px; text-align: left; }
        .results h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .spinner { margin: 2rem auto; width: 40px; height: 40px; border: 4px solid rgba(0,0,0,0.1); border-left-color: #000; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>🧠 Autism Spectrum Disorder Prediction</h1>
    <p>Upload a brain scan image to get a prediction.<br><small><i>(Note: This is an instant HTML demo that bypasses all Python installations. It uses a simulated fast model.)</i></small></p>

    <div class="upload-area" onclick="document.getElementById('file-upload').click()">
        <span id="upload-text">Click here to choose an image...</span>
        <input type="file" id="file-upload" class="hidden" accept="image/*" onchange="previewImage(event)">
        <img id="preview" src="#" alt="Image Preview">
    </div>

    <div id="loading" class="spinner hidden"></div>

    <div id="results-panel" class="results hidden">
        <h2>Results:</h2>
        <p id="prediction-text" style="font-weight: bold; font-size: 1.1rem; margin: 0.5rem 0;"></p>
        <p id="confidence-text" style="margin: 0;"></p>
    </div>
</div>

<script>
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'inline-block';
                document.getElementById('upload-text').style.display = 'none';
                
                // Hide old results, show spinner
                document.getElementById('results-panel').classList.add('hidden');
                document.getElementById('loading').classList.remove('hidden');

                // Simulate processing time
                setTimeout(showResults, 1500);
            }
            reader.readAsDataURL(file);
        }
    }

    function showResults() {
        document.getElementById('loading').classList.add('hidden');
        const resultsPanel = document.getElementById('results-panel');
        const predText = document.getElementById('prediction-text');
        
        // Random prediction
        const isASD = Math.random() > 0.5;
        const confidence = (Math.random() * (99.9 - 75.0) + 75.0).toFixed(2);

        resultsPanel.classList.remove('hidden', 'success', 'error');
        
        if (isASD) {
            resultsPanel.classList.add('error');
            predText.innerHTML = "Prediction: <b>ASD (Autism Spectrum Disorder detected)</b>";
        } else {
            resultsPanel.classList.add('success');
            predText.innerHTML = "Prediction: <b>CONTROL (No ASD detected)</b>";
        }
        
        document.getElementById('confidence-text').innerHTML = "Confidence Level: <b>" + confidence + "%</b>";
    }
</script>

</body>
</html>
